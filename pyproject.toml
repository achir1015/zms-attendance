[project]
name = "zms-attendance"
version = "0.7.0"
description = "資料助秘刷卡考勤系統"
authors = [{ name = "吳玉柱" }]
requires-python = ">=3.10"
# 手機 App（flet build ipa／apk）用；電腦版另見 tools/build_windows.py、tools/build_macos.sh
dependencies = ["flet==1.1.2", "flet-audio==1.1.2", "xlrd>=2.0", "xlwt>=1.3", "openpyxl>=3.1", "certifi"]

[tool.flet]
org = "com.achir"
product = "資料助秘刷卡考勤系統"
company = "吳玉柱"
copyright = "© 2026 吳玉柱"

[tool.flet.app]
path = "."
exclude = ["tests", "tools", "packaging", "data", "data_mobile", ".venv", "dist", "dist-installer", "dist-mac",
           "build-mac", "dist-ios", "dist-android", "build", "docs", "esp32", "firmware", "run_web.py",
           "run_web_mobile.py", "*.spec", "assets/icon.ico", "*.log", "*.docx", "web.log", ".claude", "README.md"]

[tool.flet.deep_linking]
scheme = "zmsatt"
host = "connect"

[tool.flet.android.permission]
"android.permission.INTERNET" = true

[tool.flet.ios]
bundle_id = "com.achir.zmsattendance"
team_id = "7BN6XJ59KP"

[tool.flet.ios.info]
NSLocalNetworkUsageDescription = "連到公司電腦上的刷卡考勤系統"
ITSAppUsesNonExemptEncryption = false
UIRequiresFullScreen = true
UISupportedInterfaceOrientations = ["UIInterfaceOrientationPortrait"]
"UISupportedInterfaceOrientations~ipad" = ["UIInterfaceOrientationLandscapeLeft", "UIInterfaceOrientationLandscapeRight"]
